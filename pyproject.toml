[project]
name = "support-case-rag"
version = "0.1.0"
description = "A RAG tool that can answer user queries using previous support case data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic==2.11.10",
    # LlamaIndex - Used for RAG functionality (ingestion, retrieval, query engine)
    "llama-index==0.14.5",
    "llama-index-vector-stores-chroma==0.5.3",
    "llama-index-llms-openai-like==0.5.3",
    "llama-index-embeddings-openai-like==0.2.2",
    "llama-index-retrievers-bm25==0.6.5",
    "llama-index-readers-web==0.5.5",
    # Google ADK - Used for agent functionality
    "google-adk>=0.2.0",
    # UI and utilities
    "gradio==5.49.1",
    "validators==0.35.0",
    "boto3==1.40.53",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
